<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>LuCDA</title>
    <meta
      name="description"
      content="把可疑的话发进来，看清楚它在做什么，拿到该怎么说。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 顶栏：品牌字 + 演示样例入口。全产品只有它和下面两块，没有别的（执行指令 §8.1、铁律 5）。 -->
    <header class="topbar">
      <span class="brand">LuCDA</span>
      <button id="demoBtn" class="top-btn" type="button">演示样例</button>
    </header>

    <!-- ① 发出去的东西 + ② AI 的回复。再发一条就往下接，不是会话列表（GOAL §2.1）。 -->
    <main id="feed" class="feed" aria-live="polite"></main>

    <!-- ③ 输入口：唯一的行动点。三种输入进同一个入口。 -->
    <div class="composer" id="composer">
      <div class="composer-inner">
        <div class="paste" id="pasteArea" hidden>
          <label class="paste-label" for="pasteInput">把他的话粘在这里</label>
          <textarea
            id="pasteInput"
            class="paste-input"
            rows="3"
            autocomplete="off"
            spellcheck="false"
            placeholder="例：阿姨您就像我亲妈一样，这个胶囊是院士研发的"
          ></textarea>
          <div class="paste-actions">
            <button id="sendBtn" class="btn btn-primary" type="button">
              发出去
            </button>
            <button id="closePasteBtn" class="btn btn-ghost" type="button">
              收起
            </button>
          </div>
        </div>

        <button id="micBtn" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2.4" width="6" height="11" rx="3" />
            <path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0" />
            <path d="M12 17.8v3.6" />
          </svg>
          <span>按住说话</span>
        </button>
        <div class="row2">
          <button id="camBtn" class="btn btn-secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 8.6a2 2 0 0 1 2-2h2.2l1.3-2.1h7l1.3 2.1H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
              <circle cx="12" cy="12.4" r="3.5" />
            </svg>
            <span>拍一下</span>
          </button>
          <button id="pasteBtn" class="btn btn-secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8.2" y="2.6" width="7.6" height="4.2" rx="1.6" />
              <path
                d="M15.8 4.8H18a2 2 0 0 1 2 2v12.2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.8a2 2 0 0 1 2-2h2.2"
              />
              <path d="M8.6 11.4h6.8M8.6 15.4h4.6" />
            </svg>
            <span>粘贴文字</span>
          </button>
        </div>

        <input id="fileInput" type="file" accept="image/*" hidden />
        <p class="composer-note" id="composerNote" hidden></p>
      </div>
    </div>

    <!-- 浮层：原地覆盖，关掉回原处，全程不换屏（P9、§8.2）。只开一个，开新的自动关旧的。 -->
    <div id="overlay" class="overlay" hidden>
      <div class="ov-backdrop" data-close="1"></div>
      <div
        class="ov-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ovKicker"
      >
        <div class="ov-head">
          <button id="ovClose" class="ov-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" />
            </svg>
            <span>关掉</span>
          </button>
          <span class="ov-kicker" id="ovKicker">浮层</span>
        </div>
        <div class="ov-body" id="ovBody"></div>
      </div>
    </div>

    <img id="imgProbe" alt="" hidden />
    <script src="config.js"></script>
    <script src="taboos.js"></script>
    <script src="app.js"></script>
  </body>
</html>
